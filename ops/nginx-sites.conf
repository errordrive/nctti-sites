# NCTTI Sites — nginx config (place in /etc/nginx/sites-available/nctti-sites)
# Assumes wildcard cert from certbot dns-cloudflare (see ops/setup-vps.sh).

# Map the requested host to a subdomain directory.
map $host $usersub {
    ~^(?<sub>[a-z0-9-]+)\.sites\.nctti\.tech$  $sub;
    default                                    "";
}

# ---- user sites: static files ONLY, never execute anything ----
server {
    listen 80;
    listen 443 ssl;
    server_name *.sites.nctti.tech;

    ssl_certificate     /etc/letsencrypt/live/sites.nctti.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sites.nctti.tech/privkey.pem;

    if ($usersub = "") { return 444; }

    root /var/www/sites/$usersub;
    index index.html;

    # static only: no PHP, no CGI, nothing executes
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }                    # hidden files
    location ~* \.(php|pl|py|sh|cgi)$ { deny all; }  # belt & suspenders

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    access_log /var/log/nginx/nctti-sites-users.log;
}

# ---- main app (Node) ----
server {
    listen 80;
    listen 443 ssl;
    server_name sites.nctti.tech;

    ssl_certificate     /etc/letsencrypt/live/sites.nctti.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sites.nctti.tech/privkey.pem;

    # uploads can be large (zip deploys)
    client_max_body_size 60M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    access_log /var/log/nginx/nctti-sites-app.log;
}
